<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Bots</title>
<style>
  :root{--bg:#0b0d14;--card:#151a26;--line:#252c3d;--txt:#e9eef7;--mut:#8b93a8;--acc:#7c5cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,sans-serif;padding:22px 16px 60px}
  .wrap{max-width:620px;margin:0 auto}
  h1{text-align:center;font-size:24px;margin:0 0 4px}
  .sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 20px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;text-align:center;padding:11px;border:1px solid var(--line);border-radius:11px;cursor:pointer;color:var(--mut);font-weight:600;background:var(--card)}
  .tab.on{border-color:var(--acc);color:#fff;background:#1b1f33}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
  input{width:100%;background:#0d1119;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font:15px ui-monospace,monospace}
  input:focus{outline:none;border-color:var(--acc)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 10px}
  .presets button{padding:14px;border:0;border-radius:12px;font:700 15px system-ui;color:#fff;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#3b82f6)}
  .presets button:disabled{opacity:.5}
  .presets small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:2px}
  #stop{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#1b1f33;color:#e9eef7;font:600 14px system-ui;cursor:pointer}
  .log{margin-top:16px;background:#0d1119;border:1px solid var(--line);border-radius:12px;padding:12px;height:230px;overflow:auto;font:12px ui-monospace,monospace;color:#9fe6a0;white-space:pre-wrap}
  .log .b{color:#8b93a8}
  .count{text-align:center;color:var(--mut);font-size:13px;margin-top:12px}
  .count b{color:#7ee787}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Game Bots</h1>
  <p class="sub">Runs through your own Vercel server — works on school wifi.</p>

  <div class="tabs">
    <div class="tab on" data-g="kahoot">Kahoot</div>
    <div class="tab" data-g="blooket">Blooket</div>
    <div class="tab" data-g="wayground">Wayground</div>
  </div>

  <div class="box">
    <div class="row">
      <div><label id="codelbl">Game PIN</label><input id="pin" inputmode="numeric" placeholder="1234567"></div>
      <div><label>Name prefix</label><input id="prefix" value="bot"></div>
    </div>
    <div class="presets">
      <button data-n="10">10<small>bots</small></button>
      <button data-n="30">30<small>bots</small></button>
      <button data-n="50">50<small>bots</small></button>
    </div>
    <button id="stop">Stop all</button>
    <div class="count">Live: <b id="live">0</b> · joined <b id="ok">0</b></div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
/* ---------- proxy ---------- */
const PX = async (url, o = {}) => {
  try {
    const r = await fetch('/api/px', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, method: o.method || 'GET', headers: o.headers || {}, body: o.body ?? null })
    });
    return await r.json();
  } catch (e) { return { status: 0, error: String(e), text: '' }; }
};

const NAMES = ['Liam','Noah','Ethan','Mason','Lucas','Aiden','Jayden','Logan','Ryan','Tyler','Dylan','Jacob','Owen','Leo','Kai','Mia','Ava','Zoe','Lily','Emma','Ruby','Ivy','Ella','Nora','Max','Sam','Ben','Alex','Jack','Finn','Oscar','Milo','Hugo','Ezra','Theo','Rex','Nova','Sky','Ash','Jax'];
const $ = id => document.getElementById(id);
const logEl = $('log');
let live = 0, ok = 0, game = 'kahoot', bots = [];

const say = (msg, cls='') => {
  const t = new Date().toLocaleTimeString();
  logEl.innerHTML += `<span class="${cls}">[${t}]</span> ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
};
const bump = () => { $('live').textContent = live; $('ok').textContent = ok; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  game = t.dataset.g;
  $('codelbl').textContent = game === 'kahoot' ? 'Game PIN' : game === 'blooket' ? 'Game ID' : 'Join code';
  $('pin').placeholder = game === 'kahoot' ? '1234567' : '123456';
});

/* ================= KAHOOT ================= */
class Kahoot {
  constructor(pin, name, idx) { this.pin = pin; this.name = name; this.idx = idx; this.dead = false; this.q = 0; this.qs = 0; }

  solve(challenge) {
    const K = {
      newId() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }); },
      newInteger(a, b) { return Math.floor(Math.random() * ((b - a) + 1)) + a; },
      newString(n) { let s = ''; while (s.length < n) s += Math.random().toString(36).slice(2); return s.slice(0, n); },
      newDate() { return Date.now(); },
      getTimezoneOffset() { return new Date().getTimezoneOffset(); },
      token: ''
    };
    try { new Function('Kahoot', challenge)(K); } catch (e) {}
    return K.token || '';
  }

  async start() {
    live++; bump();
    const r = await PX(`https://kahoot.it/reserve/session/${this.pin}/?${Date.now()}`, { headers: { accept: 'application/json' } });
    const raw = r.headers && r.headers['x-kahoot-session-token'];
    if (!raw) { say(`${this.name}: bad PIN`, 'b'); live--; bump(); return; }
    let challenge = '';
    try { challenge = JSON.parse(r.text).challenge; } catch (e) { challenge = ''; }
    this.token = challenge ? this.solve(challenge) : raw;
    this.hdr = { 'x-kahoot-session-token': this.token, 'content-type': 'application/json', accept: 'application/json' };
    this.base = `https://kahoot.it/cometd/${this.pin}/b${this.idx}${Math.random().toString(36).slice(2, 7)}`;

    const hs = await this.post([{ channel: '/meta/handshake', version: '1.0', minimumVersion: '1.0', supportedConnectionTypes: ['long-polling'], advice: { timeout: 60000, interval: 0 }, id: '1' }], '/handshake');
    let out; try { out = JSON.parse(hs.text); } catch (e) { out = null; }
    this.clientId = out && out[0] && out[0].clientId;
    if (!this.clientId) { say(`${this.name}: handshake failed`, 'b'); live--; bump(); return; }

    await this.post([
      { channel: '/meta/subscribe', clientId: this.clientId, subscription: '/service/player', id: '2' },
      { channel: '/meta/subscribe', clientId: this.clientId, subscription: '/service/controller', id: '3' }
    ]);
    await this.post([{
      channel: '/service/controller', clientId: this.clientId, id: '4',
      data: { type: 'login', gameid: this.pin, host: 'kahoot.it', name: this.name, content: JSON.stringify({ device: { mobile: false, referrer: 'https://kahoot.it/' } }) }
    }]);
    ok++; bump();
    say(`✅ ${this.name} joined Kahoot`);
    this.idc = 10;
    this.loop();
  }

  post(msgs, suffix = '') {
    return PX(this.base + suffix, { method: 'POST', headers: this.hdr, body: JSON.stringify(msgs) });
  }

  async loop() {
    while (!this.dead) {
      const r = await this.post([{ channel: '/meta/connect', clientId: this.clientId, connectionType: 'long-polling', id: String(++this.idc) }]);
      try {
        const msgs = JSON.parse(r.text);
        for (const m of msgs) this.onMsg(m);
      } catch (e) {}
      await sleep(120);
    }
    live--; bump();
  }

  onMsg(m) {
    const d = m.data; if (!d) return;
    if (m.channel === '/service/player' && d.type === 'questionStart') {
      this.q = d.questionIndex ?? (this.q + 1);
      this.qs = Date.now();
      this.answer(d);
    }
  }

  async answer(d) {
    await sleep(250 + Math.random() * 700);
    if (this.dead) return;
    const n = d.numberOfChoices || 4;
    const choice = Math.floor(Math.random() * n);
    await this.post([{
      channel: '/service/controller', clientId: this.clientId, id: String(100 + this.q),
      data: {
        type: 'message', gameid: this.pin, host: 'kahoot.it', id: String(this.q),
        content: JSON.stringify({ type: 'quiz', choice, question: this.q, time: Date.now() - this.qs })
      }
    }]);
  }

  stop() { this.dead = true; }
}

/* ================= BLOOKET ================= */
class Blooket {
  constructor(pin, name, idx) { this.pin = pin; this.name = name; this.idx = idx; this.dead = false; }
  async start() {
    live++; bump();
    const r = await PX('https://api.blooket.com/api/firebase/join', {
      method: 'POST',
      headers: { 'content-type': 'application/json', accept: 'application/json', referer: 'https://www.blooket.com/', origin: 'https://www.blooket.com' },
      body: JSON.stringify({ id: String(this.pin), name: this.name })
    });
    if (r.status === 200) { ok++; say(`✅ ${this.name} joined Blooket`); this.token = r.text; }
    else say(`${this.name}: ${r.status} ${String(r.text).slice(0, 90)}`, 'b');
    bump();
  }
  stop() { this.dead = true; live--; bump(); }
}

/* ================= WAYGROUND ================= */
class Wayground {
  constructor(pin, name, idx) { this.pin = pin; this.name = name; this.idx = idx; this.dead = false; }
  async start() {
    live++; bump();
    const tries = [
      ['https://game.quizizz.com/play-api/v4/joinGame', { roomCode: String(this.pin), name: this.name }],
      ['https://wayground.com/_api/main/joinGame', { roomCode: String(this.pin), name: this.name }],
      ['https://quizizz.com/_api/main/joinGame', { roomCode: String(this.pin), name: this.name }]
    ];
    for (const [url, body] of tries) {
      const r = await PX(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', accept: 'application/json' },
        body: JSON.stringify(body)
      });
      if (r.status === 200 && /player|room|success|id/i.test(r.text || '')) {
        ok++; say(`✅ ${this.name} joined Wayground`); bump(); return;
      }
      say(`${this.name}: ${r.status} ${String(r.text).slice(0, 80)}`, 'b');
    }
    bump();
  }
  stop() { this.dead = true; live--; bump(); }
}

/* ================= CONTROL ================= */
const CLASS = { kahoot: Kahoot, blooket: Blooket, wayground: Wayground };

document.querySelectorAll('.presets button').forEach(b => b.onclick = async () => {
  const pin = $('pin').value.trim();
  if (!pin) return alert('Enter the game code first');
  const n = +b.dataset.n;
  const pre = ($('prefix').value.trim() || 'bot').slice(0, 8);
  say(`— starting ${n} ${game} bots —`, 'b');
  for (let i = 1; i <= n; i++) {
    const name = `${pre}${i}_${NAMES[Math.floor(Math.random() * NAMES.length)]}`.slice(0, 15);
    const bot = new CLASS[game](pin, name, i);
    bots.push(bot);
    bot.start().catch(e => say(`${name}: ${e}`, 'b'));
    if (i % 5 === 0) await sleep(60);
  }
});

$('stop').onclick = () => { bots.forEach(b => b.stop && b.stop()); bots = []; live = 0; ok = 0; bump(); say('— stopped —', 'b'); };
</script>
</body>
</html>
